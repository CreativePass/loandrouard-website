    const posB = (b, now) => {
      const t = ((now / b.d + b.t0) % 1 + 1) % 1, c = Math.floor(now / b.d + b.t0);
      if (c !== b.cy) { b.cy = c; b.ox = b.oy = b.vx = b.vy = 0; b.sw = 0; }
      const e = t * t, rp = ((o.rp ?? 1) - 0.5) * -60;
      const a = t < 0.25 ? t / 0.25 : t < 0.7 ? 1 - 0.4 * (t - 0.25) / 0.45 : 0.6 * (1 - (t - 0.7) / 0.3);
      const ext = b.sw ? Math.max(0, 1 - (now - b.sw) / 1100) : 1;
      return [ox + (b.x + b.dx * e) * k + b.ox, oy + (b.y + b.dy * e + rp) * k + b.oy, a * ext * ext];
    };
    const entre = () => { survol = 1; }, sort = () => { survol = 0; };
    if (nom) { nom.addEventListener("pointerenter", entre); nom.addEventListener("pointerleave", sort); }
    for (let i = 0; i < 480; i++) { const ri = (Math.random() * routes.length) | 0; parts.push(grain(ri, Math.random() * (routes[ri].pts.length - 2))); }
    const geo = () => {
      const sr = sec.getBoundingClientRect(), zr = zone.getBoundingClientRect();
      k = zr.width / W; ox = zr.left - sr.left; oy = zr.top - sr.top;
      dpr = Math.min(2, devicePixelRatio || 1);
      const w = Math.round(sr.width * dpr), h = Math.round(sr.height * dpr);
      if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
      return sr;
    };
    const point = (x, y, r, c, a, sc, brille) => {
      if (brille) { cx.fillStyle = "rgba(" + c + "," + a * sc * 0.4 + ")"; cx.beginPath(); cx.arc(x, y, r * 3.6, 0, 6.283); cx.fill(); }
      cx.fillStyle = "rgba(" + c + "," + Math.min(1, a * (brille ? 0.7 + 0.6 * sc : 0.9)) + ")";
      cx.beginPath(); cx.arc(x, y, r, 0, 6.283); cx.fill();
    };
    const boucle = (now) => {
      const dt = Math.max(0, Math.min(0.05, (now - prev) / 1000)); prev = now;
      geo();
      boost += (survol - boost) * Math.min(1, dt * (survol ? 2.2 : 1.2));
      acc += dt * TAUX * (1 + 0.4 * boost);
      while (acc >= 1) { acc--; parts.push(grain((Math.random() * routes.length) | 0, 0)); }
      cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, cv.width, cv.height);
      cx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cx.globalCompositeOperation = "lighter"; cx.globalAlpha = o.lit;
      const s = now / 1000;
      let arrivees = 0;
      cx.globalCompositeOperation = "source-over";
      for (const b of braises) {
        b.ox += b.vx * dt; b.oy += b.vy * dt;
        const am = Math.exp(-dt * 1.4); b.vx *= am; b.vy *= am;
        const [x, y, a] = posB(b, now);
        cx.fillStyle = "rgba(" + b.c + "," + a + ")"; cx.beginPath(); cx.arc(x, y, b.r * k, 0, 6.283); cx.fill();
      }
      cx.globalCompositeOperation = "lighter";
      parts = parts.filter((p) => {
        const rt = routes[p.ri], n = rt.pts.length;
        p.s += vitesse(p, rt) * dt;
        if (p.s >= n - 1) { arrivees++; return false; }
        const [x, y, , , r] = pos(p), fin = n - 1 - p.s;
        const a = p.a0 * Math.min(1, p.s / 12, fin / 10);
        point(x, y, r, p.c, a, 0.55 + 0.45 * Math.sin(p.ph * 3 + s * p.fr * 7), p.brille);
        return true;
      });
      libres = libres.filter((p) => now - p.t0 < p.vie);
      for (const p of libres) {
        const age = now - p.t0, kk = age / p.vie, t = age / 1000;
        const rafale = 0.75 + 0.25 * Math.sin(t * 5 + p.ph);
        const kv = now - p.doux < 700 ? 3 + 6 * ((now - p.doux) / 700) ** 2 : 9;
        p.vx += (p.wx * rafale - p.vx) * kv * dt; p.vy += (p.wy * rafale - p.vy) * kv * dt;
        p.x += p.vx * dt; p.y += (p.vy + Math.sin(p.ph + t * p.fr * 6) * 3) * dt;
        point(p.x, p.y, p.r * (1 - kk * 0.5), p.c, p.a0 * (1 - kk) ** 1.6, 0.55 + 0.45 * Math.sin(p.ph * 3 + t * p.fr * 7), p.brille);
      }
      const bat = (u) => { u = ((u % 3.6) + 3.6) % 3.6; return Math.exp(-(((u - 0.5) / 0.5) ** 2)) + 0.45 * Math.exp(-(((u - 1.35) / 0.6) ** 2)); };
      const f = Math.min(1, 0.12 + 0.72 * bat(s - 0.15) + 0.16 * boost);
      sec.style.setProperty("--flux", (f * o.lit).toFixed(3));
      flaques.forEach((el, i) => { el.style.opacity = (el.__b * (0.8 + 0.2 * bat(s - i * 0.12))).toFixed(3); });
      raf = requestAnimationFrame(boucle);
    };
    let mx = 0, my = 0, mt = 0, svx = 0, svy = 0;
    const onMove = (e) => {
      const t = performance.now(), d = Math.max(8, t - mt) / 1000;
      if (mt) { const m = Math.min(1, d * 12); svx += ((e.clientX - mx) / d - svx) * m; svy += ((e.clientY - my) / d - svy) * m; }
      mx = e.clientX; my = e.clientY; mt = t;
      if (!raf || o.lit <= 0) return;
      const vit = Math.hypot(svx, svy); if (vit < 150) return;
      const sr = sec.getBoundingClientRect(), px = e.clientX - sr.left, py = e.clientY - sr.top;
      const R = 70, m = Math.min(1, (vit - 150) / 1500), tx = svx * 0.17, ty = svy * 0.17;
      const vent = (p, d) => { const w = (1 - d / R) ** 2 * (0.18 + 0.37 * m); p.wx += (tx - p.wx) * w; p.wy += (ty - p.wy) * w; p.vx += (tx - p.vx) * w * 0.12; p.vy += (ty - p.vy) * w * 0.12; p.doux = t; };
      parts = parts.filter((p) => {
        const rt = routes[p.ri];
        if (p.s < rt.u) return true;
        const [x, y, dx, dy, r] = pos(p), d = Math.hypot(x - px, y - py);
        if (d > R) return true;
        const v = vitesse(p, rt) * 2 * k, l = Math.hypot(dx, dy) || 1;
        const q = { x, y, vx: dx / l * v, vy: dy / l * v, wx: dx / l * v, wy: dy / l * v, r, c: p.c, ph: p.ph, fr: p.fr, brille: p.brille, a0: p.a0, t0: t, vie: 800 + Math.random() * 800, doux: t };
        vent(q, d); libres.push(q);
        return false;
      });
      for (const p of libres) { const d = Math.hypot(p.x - px, p.y - py); if (d <= R) vent(p, d); }
      for (const b of braises) {
        const [x, y] = posB(b, t), d = Math.hypot(x - px, y - py); if (d > R * 0.85) continue;
        const w = (1 - d / (R * 0.85)) ** 2 * (0.06 + 0.1 * m);
        b.vx += (tx * 0.35 - b.vx) * w; b.vy += (ty * 0.35 - b.vy) * w; if (!b.sw && b.fragile) b.sw = t;
      }
    };
    addEventListener("pointermove", onMove, { passive: true });
    o.jouer = (on) => {
      if (on && !raf) { prev = performance.now(); raf = requestAnimationFrame(boucle); }
      else if (!on && raf) { cancelAnimationFrame(raf); raf = 0; }
    };
    o.off = () => { o.jouer(false); removeEventListener("pointermove", onMove); if (nom) { nom.removeEventListener("pointerenter", entre); nom.removeEventListener("pointerleave", sort); } cv.remove(); };
    return o;
  }

  renderVals() {
    const C = this.comptes() || [];
    const pris = new Set(FAMILLES.flatMap((f) => f.reseaux));
    const familles = FAMILLES.map((f) => ({ titre: f.titre, hanzi: f.hanzi, liens: f.reseaux.map((r) => C.find((c) => c.reseau === r)).filter(Boolean) }));
    familles[familles.length - 1].liens.push(...C.filter((c) => !pris.has(c.reseau)));
    return {
      familles,
      refPied: this.refPied,
      surtitre: this.props.surtitre ?? "Powered by",
      sponsors: SPONSORS.map((s) => Object.assign({ nomSeul: !s.logo && !s.hanzi, cls: "ld-balaie" }, s, { url: s.url || undefined })),
      refTrace: this.refTrace,
      refSec: this.refSec,
      refNom: this.refNom,
    };
  }
}
</script>
